<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ahmed Islam</title>
    <script>
      // Encoder half of the GitHub Pages SPA shim (decoder is in index.html).
      // Pages can't rewrite, so a hard load of /projects lands here; this turns
      // it into /?/projects, which serves index.html with the path recoverable.
      var l = window.location
      l.replace(
        l.protocol + '//' + l.host + '/?/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>

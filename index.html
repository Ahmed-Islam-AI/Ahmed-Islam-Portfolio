<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahmed Islam — Full-Stack AI Engineer</title>
    <meta
      name="description"
      content="Ahmed Islam builds production AI systems and the full-stack products around them, LangGraph, LangChain, MCP and RAG on the back end, React and Next.js on the front."
    />
    <!-- Share previews. blog.vite.ts rewrites title, description, og:* and the
         canonical per blog page at build time, so every tag it touches must
         stay here; it throws if one goes missing. -->
    <link rel="canonical" href="https://ahmedislam.tech/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ahmed Islam" />
    <meta property="og:title" content="Ahmed Islam — Full-Stack AI Engineer" />
    <meta
      property="og:description"
      content="Ahmed Islam builds production AI systems and the full-stack products around them, LangGraph, LangChain, MCP and RAG on the back end, React and Next.js on the front."
    />
    <meta property="og:url" content="https://ahmedislam.tech/" />
    <meta property="og:image" content="https://ahmedislam.tech/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#faf7f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Decoder half of the GitHub Pages SPA shim in public/404.html — puts the
      // real path back before React Router reads the URL. No-op on every other
      // host, and on Pages for any URL that didn't come through 404.html,
      // because nothing else produces a `?/` query.
      if (location.search[1] === '/') {
        var decoded = location.search
          .slice(1)
          .split('&')
          .map(function (part) {
            return part.replace(/~and~/g, '&')
          })
          .join('?')
        history.replaceState(null, '', location.pathname.slice(0, -1) + decoded + location.hash)
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..125,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
